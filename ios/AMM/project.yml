name: AMM
options:
  bundleIdPrefix: com.evolo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    exactVersion: 1.3.3
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 150.0.0
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CLERK_PUBLISHABLE_KEY: ""
    AMM_API_BASE_URL: https://aftermarketmovers.com
targets:
  AMM:
    type: application
    platform: iOS
    sources:
      - path: AMM
        excludes:
          - Preview Content
    resources:
      - path: AMM/Resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: AMM
        CFBundleName: AMM
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.evolo.amm
            CFBundleURLSchemes:
              - com.evolo.amm
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: AMM uses the microphone only while you are talking to a selected company thesis.
        AMMAPIBaseURL: $(AMM_API_BASE_URL)
        ClerkPublishableKey: $(CLERK_PUBLISHABLE_KEY)
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Config/AMM.entitlements
      properties:
        com.apple.developer.associated-domains:
          - webcredentials:aftermarketmovers.com
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      - package: WebRTC
        product: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evolo.amm
        PRODUCT_NAME: AMM
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  AMMTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AMMTests
    dependencies:
      - target: AMM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evolo.amm.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AMM:
    build:
      targets:
        AMM: all
        AMMTests: [test]
    test:
      targets:
        - AMMTests
