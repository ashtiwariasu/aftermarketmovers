name: iOS native

on:
  pull_request:
    paths:
      - ".github/workflows/ios-native.yml"
      - "ios/AMM/**"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/ios-native.yml"
      - "ios/AMM/**"
  workflow_dispatch:

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator-tests:
    name: Build and test on iPhone
    runs-on: macos-15
    timeout-minutes: 35

    env:
      # Clerk configuration is required during application startup. This is a
      # non-secret, syntactically valid test frontend key used only by CI.
      CLERK_PUBLISHABLE_KEY: pk_test_YW1tLW5hdGl2ZS1jaS5jbGVyay5hY2NvdW50cy5kZXYk
      AMM_API_BASE_URL: https://dev.aftermarketmovers.com
      DERIVED_DATA: ${{ github.workspace }}/.derived-data
      RESULT_BUNDLE: ${{ github.workspace }}/AMMTests.xcresult

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          set -euo pipefail
          LATEST_XCODE="$(
            python3 - <<'PY'
          import glob
          import os
          import re

          candidates = []
          for path in glob.glob("/Applications/Xcode*.app"):
              match = re.search(r"Xcode[_-]?([0-9]+(?:\.[0-9]+)*)", os.path.basename(path))
              if match:
                  version = tuple(int(part) for part in match.group(1).split("."))
                  candidates.append((version, path))

          if not candidates:
              fallback = "/Applications/Xcode.app"
              if not os.path.isdir(fallback):
                  raise SystemExit("No Xcode installation is available")
              print(fallback)
          else:
              print(max(candidates)[1])
          PY
          )"
          echo "Selecting ${LATEST_XCODE}"
          sudo xcode-select --switch "${LATEST_XCODE}/Contents/Developer"

      - name: Report native toolchain
        run: |
          set -euo pipefail
          ls -1d /Applications/Xcode*.app
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate deterministic Xcode project
        working-directory: ios/AMM
        run: |
          set -euo pipefail
          xcodegen generate
          git diff --exit-code -- AMM.xcodeproj/project.pbxproj

      - name: Resolve Swift packages
        working-directory: ios/AMM
        run: |
          set -euo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project AMM.xcodeproj \
            -scheme AMM \
            -clonedSourcePackagesDirPath "${DERIVED_DATA}/SourcePackages"

      - name: Select and boot simulator
        id: simulator
        run: |
          set -euo pipefail
          UDID="$(
            xcrun simctl list devices available --json |
              python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          preferred = ("iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro", "iPhone 15")
          devices = [
              device
              for runtime_devices in data["devices"].values()
              for device in runtime_devices
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          for name in preferred:
              match = next((device for device in devices if device["name"] == name), None)
              if match:
                  print(match["udid"])
                  break
          else:
              if not devices:
                  raise SystemExit("No available iPhone simulator")
              print(devices[0]["udid"])
          '
          )"
          xcrun simctl boot "${UDID}" 2>/dev/null || true
          xcrun simctl bootstatus "${UDID}" -b
          echo "udid=${UDID}" >> "${GITHUB_OUTPUT}"

      - name: Build and run unit tests
        working-directory: ios/AMM
        run: |
          set -euo pipefail
          rm -rf "${RESULT_BUNDLE}"
          xcodebuild \
            test \
            -project AMM.xcodeproj \
            -scheme AMM \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "${DERIVED_DATA}" \
            -clonedSourcePackagesDirPath "${DERIVED_DATA}/SourcePackages" \
            -resultBundlePath "${RESULT_BUNDLE}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CLERK_PUBLISHABLE_KEY="${CLERK_PUBLISHABLE_KEY}" \
            AMM_API_BASE_URL="${AMM_API_BASE_URL}"

      - name: Upload native test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AMMTests-${{ github.run_attempt }}
          path: AMMTests.xcresult
          if-no-files-found: ignore
          retention-days: 14
